name: Phase 04A — Option C prototype (controlled Prisma migration workflow)

# Isolated prototype for the Option C architectural alternative.
# Disposable databases only. No production credentials or URLs.
# All versions pinned.
#
# Tests the central claim of Option C: schema-to-schema migration diffs never
# propose dropping the five composite FKs, so a reviewed-SQL baseline plus
# schema-to-schema-only migrations can retain C-1..C-5 safely.

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - '.github/workflows/phase04a-option-c-prototype.yml'
      - 'docs/database/g1-spike/option-c/**'
      - 'docs/database/g1-spike/experiment-2/manual/**'
      - 'docs/database/g1-spike/sql/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - '.github/workflows/phase04a-option-c-prototype.yml'
      - 'docs/database/g1-spike/option-c/**'
      - 'docs/database/g1-spike/experiment-2/manual/**'
      - 'docs/database/g1-spike/sql/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  option-c:
    name: Option C prototype (node ${{ matrix.node }}, postgres 16)
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        node: ['22']

    # Two disposable databases: one for the primary workflow, one for the
    # independent replay that proves reproducibility.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oc
          POSTGRES_PASSWORD: ocspike
          POSTGRES_DB: oc_main
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      postgres-replay:
        image: postgres:16
        env:
          POSTGRES_USER: oc
          POSTGRES_PASSWORD: ocspike
          POSTGRES_DB: oc_replay
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U oc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # A third disposable database: `migrate diff --from-migrations` requires
      # datasource.shadowDatabaseUrl in Prisma 7, so the CI drift check cannot
      # be exercised without one.
      postgres-shadow:
        image: postgres:16
        env:
          POSTGRES_USER: oc
          POSTGRES_PASSWORD: ocspike
          POSTGRES_DB: oc_shadow
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U oc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PRISMA_VERSION: '7.10.1'
      PGPASSWORD: ocspike

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install the project's pinned dependencies
        run: npm ci

      - name: Assert the pinned Prisma CLI
        run: |
          set -euo pipefail
          cli="$(node -p "require('./node_modules/prisma/package.json').version")"
          echo "prisma CLI: $cli"
          if [ "$cli" != "$PRISMA_VERSION" ]; then
            echo "::error::prisma CLI is $cli, expected $PRISMA_VERSION"
            exit 1
          fi
          test -x node_modules/.bin/prisma || { echo "::error::pinned prisma binary missing"; exit 1; }

      - name: Ensure a PostgreSQL client and report versions
        run: |
          set -uo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            echo "psql not found; installing postgresql-client"
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client >/dev/null
          fi
          psql --version
          rc=0
          for target in "5432 oc_main" "5433 oc_replay" "5434 oc_shadow"; do
            set -- $target
            port="$1"; db="$2"
            if out="$(psql -h localhost -p "$port" -U oc -d "$db" -Atc 'SHOW server_version;' 2>&1)"; then
              echo "postgres on $port ($db): $out"
            else
              echo "::error::cannot reach $db on port $port: $out"
              rc=1
            fi
          done
          exit $rc

      # NOTE: no "?schema=public" — that parameter is Prisma-specific and
      # libpq rejects it. The prototype uses the default public schema.
      - name: Run the Option C prototype
        id: prototype
        run: |
          set -euo pipefail
          bash docs/database/g1-spike/option-c/run.sh \
            --url        "postgresql://oc:ocspike@localhost:5432/oc_main" \
            --shadow-url "postgresql://oc:ocspike@localhost:5434/oc_shadow" \
            --replay-url "postgresql://oc:ocspike@localhost:5433/oc_replay"

      # Independent re-read of the catalog, in case the driver's bookkeeping
      # is wrong. Only meaningful when the prototype actually ran.
      - name: Assert the five composite FKs are still in the catalog
        if: always() && steps.prototype.outcome != 'skipped'
        run: |
          set -euo pipefail
          for target in "5432 oc_main" "5433 oc_replay"; do
            set -- $target
            port="$1"; db="$2"
            n="$(psql -h localhost -p "$port" -U oc -d "$db" -Atc "
              SELECT count(*) FROM pg_constraint
              WHERE connamespace = 'public'::regnamespace
                AND conname IN (
                  'fk_questions_level_subject','fk_questions_chapter_subject',
                  'fk_questions_topic_chapter','fk_questions_subtopic_topic',
                  'fk_answer_keys_options_of_version');" 2>/dev/null || echo 0)"
            echo "$db (port $port): $n/5 composite FKs"
            if [ "$n" != "5" ]; then
              echo "::error::$db has $n/5 composite FKs"
              exit 1
            fi
          done

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase04a-option-c-${{ matrix.node }}
          path: docs/database/g1-spike/option-c/out/
          if-no-files-found: warn
          retention-days: 90

      - name: Job summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Phase 04A — Option C prototype"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Node | ${{ matrix.node }} |"
            echo "| Prisma (pinned) | $PRISMA_VERSION |"
            echo "| PostgreSQL | 16 |"
            echo "| Result | ${{ job.status }} |"
            echo
            if [ -f docs/database/g1-spike/option-c/out/RESULT.txt ]; then
              echo '```'
              cat docs/database/g1-spike/option-c/out/RESULT.txt
              echo '```'
            else
              echo "The prototype did not reach its summary. Read the failing step;"
              echo "each step states which claim it tests and what its result establishes."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
