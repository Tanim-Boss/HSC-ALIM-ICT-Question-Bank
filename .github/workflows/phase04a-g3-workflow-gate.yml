name: Phase 04A — G-3 workflow gate (Option C production readiness)

# G-3 acceptance gate for the Option C migration workflow.
# Disposable databases only. No production credentials or URLs. Versions pinned.
#
# G-1 remains FAILED and is not re-scored here. G-3 asks a different question:
# given that the project will not use Prisma's ordinary migration workflow, is
# the replacement workflow safe enough to operate production with?

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - '.github/workflows/phase04a-g3-workflow-gate.yml'
      - 'docs/database/g1-spike/option-c/**'
      - 'docs/database/g1-spike/sql/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - '.github/workflows/phase04a-g3-workflow-gate.yml'
      - 'docs/database/g1-spike/option-c/**'
      - 'docs/database/g1-spike/sql/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-guard:
    name: Workflow enforcement — repository guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Criterion 1, first half: nothing in an executed surface may invoke
      # `prisma migrate dev`, `migrate reset` or `db push`.
      - name: Reject prohibited Prisma migration commands
        run: bash docs/database/g1-spike/option-c/repo-guard.sh "$PWD"

  g3:
    name: G-3 gate (node ${{ matrix.node }}, postgres 16)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: repo-guard

    strategy:
      fail-fast: false
      matrix:
        node: ['22']

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: g3
          POSTGRES_PASSWORD: g3spike
          POSTGRES_DB: g3_main
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U g3"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      postgres-shadow:
        image: postgres:16
        env:
          POSTGRES_USER: g3
          POSTGRES_PASSWORD: g3spike
          POSTGRES_DB: g3_shadow
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U g3"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      postgres-replay:
        image: postgres:16
        env:
          POSTGRES_USER: g3
          POSTGRES_PASSWORD: g3spike
          POSTGRES_DB: g3_replay
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U g3"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PRISMA_VERSION: '7.10.1'
      PGPASSWORD: g3spike

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install the project's pinned dependencies
        run: npm ci

      - name: Assert the pinned Prisma CLI
        run: |
          set -euo pipefail
          cli="$(node -p "require('./node_modules/prisma/package.json').version")"
          echo "prisma CLI: $cli"
          if [ "$cli" != "$PRISMA_VERSION" ]; then
            echo "::error::prisma CLI is $cli, expected $PRISMA_VERSION"
            exit 1
          fi
          test -x node_modules/.bin/prisma || { echo "::error::pinned prisma binary missing"; exit 1; }

      - name: Ensure a PostgreSQL client and report versions
        run: |
          set -uo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client >/dev/null
          fi
          psql --version
          rc=0
          for target in "5432 g3_main" "5433 g3_shadow" "5434 g3_replay"; do
            set -- $target
            port="$1"; db="$2"
            if out="$(psql -h localhost -p "$port" -U g3 -d "$db" -Atc 'SHOW server_version;' 2>&1)"; then
              echo "postgres on $port ($db): $out"
            else
              echo "::error::cannot reach $db on port $port: $out"
              rc=1
            fi
          done
          exit $rc

      # NOTE: no "?schema=public" — Prisma-specific, libpq rejects it.
      - name: Run the G-3 gate
        id: g3
        run: |
          set -euo pipefail
          bash docs/database/g1-spike/option-c/g3/run.sh \
            --url        "postgresql://g3:g3spike@localhost:5432/g3_main" \
            --shadow-url "postgresql://g3:g3spike@localhost:5433/g3_shadow" \
            --replay-url "postgresql://g3:g3spike@localhost:5434/g3_replay"

      # Independent re-read of the catalog using the approved definitions, so
      # the gate does not rely solely on the driver's own bookkeeping.
      - name: Independent catalog assertion
        if: always() && steps.g3.outcome != 'skipped'
        run: |
          set -euo pipefail
          Q="$(python3 -c "import sys;sys.path.insert(0,'docs/database/g1-spike/option-c');import guard;print(guard.CATALOG_QUERY)")"
          rc=0
          for target in "5432 g3_main" "5434 g3_replay"; do
            set -- $target
            port="$1"; db="$2"
            psql -h localhost -p "$port" -U g3 -d "$db" -Atc \
              "SELECT json_agg(row_to_json(t)) FROM ($Q) t;" > "/tmp/$db-catalog.json" || true
            if python3 docs/database/g1-spike/option-c/guard.py catalog "/tmp/$db-catalog.json"; then
              echo "$db: OK"
            else
              echo "::error::$db failed the protected-constraint catalog assertion"
              rc=1
            fi
          done
          exit $rc

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase04a-g3-${{ matrix.node }}
          path: docs/database/g1-spike/option-c/g3/out/
          if-no-files-found: warn
          retention-days: 30

      - name: Job summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Phase 04A — G-3 workflow gate"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Node | ${{ matrix.node }} |"
            echo "| Prisma (pinned) | $PRISMA_VERSION |"
            echo "| PostgreSQL | 16 |"
            echo "| Result | ${{ job.status }} |"
            echo
            echo "G-1 remains **FAILED** and is not re-scored by this workflow."
            echo
            if [ -f docs/database/g1-spike/option-c/g3/out/RESULT.txt ]; then
              echo '```'
              cat docs/database/g1-spike/option-c/g3/out/RESULT.txt
              echo '```'
            else
              echo "The gate did not reach its verdict. Read the failing step; every step"
              echo "names the criterion it tests and what its result establishes."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
