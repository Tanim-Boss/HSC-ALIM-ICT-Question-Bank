name: Phase 04A — G-3 full-schema gate (Option C, real 18-table model)

# G-3 acceptance gate for the Option C migration workflow, run against the REAL
# Phase 04A schema: prisma/schema.prisma plus the committed baseline migration
# prisma/migrations/0001_phase04a_question_bank.
#
# This SUPERSEDES the reduced-prototype run only as evidence about the
# production schema. The prototype workflow stays in place because it is cheap
# and it is what caught three harness defects; this job is what actually closes
# G-3 (§11.6.6).
#
# G-1 remains FAILED and is not re-scored here. G-3 asks a different question:
# given that the project will not use Prisma's ordinary migration workflow, is
# the replacement workflow safe enough to operate production with?
#
# Disposable databases only. No production credentials or URLs. Versions pinned.

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - '.github/workflows/phase04a-g3-full-schema-gate.yml'
      - 'prisma/schema.prisma'
      - 'prisma/migrations/**'
      - 'docs/database/g1-spike/option-c/g3-full/**'
      - 'docs/database/g1-spike/option-c/guard.py'
      - 'docs/database/g1-spike/option-c/repo-guard.sh'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - '.github/workflows/phase04a-g3-full-schema-gate.yml'
      - 'prisma/schema.prisma'
      - 'prisma/migrations/**'
      - 'docs/database/g1-spike/option-c/g3-full/**'
      - 'docs/database/g1-spike/option-c/guard.py'
      - 'docs/database/g1-spike/option-c/repo-guard.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-guard:
    name: Workflow enforcement — repository guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Criterion 1, first half: nothing in an executed surface may invoke
      # `prisma migrate dev`, `migrate reset` or `db push`. This now also scans
      # the real prisma/migrations baseline.
      - name: Reject prohibited Prisma migration commands
        run: bash docs/database/g1-spike/option-c/repo-guard.sh "$PWD"

      - name: The committed baseline must pass the protected-FK guard
        run: |
          set -euo pipefail
          python3 docs/database/g1-spike/option-c/guard.py sql \
            prisma/migrations/0001_phase04a_question_bank/migration.sql

  g3-full:
    name: G-3 full-schema gate (node ${{ matrix.node }}, postgres 16)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: repo-guard

    strategy:
      fail-fast: false
      matrix:
        node: ['22']

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: g3
          POSTGRES_PASSWORD: g3spike
          POSTGRES_DB: g3f_main
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U g3"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      postgres-shadow:
        image: postgres:16
        env:
          POSTGRES_USER: g3
          POSTGRES_PASSWORD: g3spike
          POSTGRES_DB: g3f_shadow
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U g3"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      postgres-replay:
        image: postgres:16
        env:
          POSTGRES_USER: g3
          POSTGRES_PASSWORD: g3spike
          POSTGRES_DB: g3f_replay
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U g3"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PRISMA_VERSION: '7.10.1'
      PGPASSWORD: g3spike

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install the project's pinned dependencies
        run: npm ci

      - name: Assert the pinned Prisma CLI
        run: |
          set -euo pipefail
          cli="$(node -p "require('./node_modules/prisma/package.json').version")"
          echo "prisma CLI: $cli"
          if [ "$cli" != "$PRISMA_VERSION" ]; then
            echo "::error::prisma CLI is $cli, expected $PRISMA_VERSION"
            exit 1
          fi
          test -x node_modules/.bin/prisma || { echo "::error::pinned prisma binary missing"; exit 1; }

      # `prisma validate` proves the committed datamodel is a legal Prisma
      # schema before anything is deployed. It needs the schema engine, which is
      # why this step runs in CI rather than being assumed locally.
      - name: Validate the real Prisma datamodel
        run: node_modules/.bin/prisma validate --schema prisma/schema.prisma

      - name: Ensure a PostgreSQL client and report versions
        run: |
          set -uo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client >/dev/null
          fi
          psql --version
          rc=0
          for target in "5432 g3f_main" "5433 g3f_shadow" "5434 g3f_replay"; do
            set -- $target
            port="$1"; db="$2"
            if out="$(psql -h localhost -p "$port" -U g3 -d "$db" -Atc 'SHOW server_version;' 2>&1)"; then
              echo "postgres on $port ($db): $out"
            else
              echo "::error::cannot reach $db on port $port: $out"
              rc=1
            fi
          done
          exit $rc

      # NOTE: no "?schema=public" — Prisma-specific, libpq rejects it.
      - name: Run the G-3 full-schema gate
        id: g3
        run: |
          set -euo pipefail
          bash docs/database/g1-spike/option-c/g3-full/run.sh \
            --url        "postgresql://g3:g3spike@localhost:5432/g3f_main" \
            --shadow-url "postgresql://g3:g3spike@localhost:5433/g3f_shadow" \
            --replay-url "postgresql://g3:g3spike@localhost:5434/g3f_replay"

      # Independent re-read of the FULL shape and of the protected constraints,
      # using SQL directly, so the gate does not rely solely on the driver's own
      # bookkeeping. A driver bug that skipped an assertion would be caught here.
      - name: Independent schema inventory and catalog assertion
        # Runs even when the gate failed, so a partial deployment is still
        # inspected — but an empty database is reported, never faked into a pass.
        if: always() && steps.g3.outcome != 'skipped'
        run: |
          set -uo pipefail
          Q="$(python3 -c "import sys;sys.path.insert(0,'docs/database/g1-spike/option-c');import guard;print(guard.CATALOG_QUERY)")"
          rc=0
          for target in "5432 g3f_main" "5434 g3f_replay"; do
            set -- $target
            port="$1"; db="$2"
            f="/tmp/$db-catalog.json"
            echo "=== $db (port $port)"
            echo "--- inventory:"
            psql -h localhost -p "$port" -U g3 -d "$db" -Atc \
              "SELECT 'tables=' || (SELECT count(*) FROM pg_tables WHERE schemaname='public' AND tablename <> '_prisma_migrations')
                    || ' enums=' || (SELECT count(*) FROM pg_type WHERE typtype='e' AND typnamespace='public'::regnamespace)
                    || ' fks='    || (SELECT count(*) FROM pg_constraint WHERE contype='f' AND connamespace='public'::regnamespace)
                    || ' checks=' || (SELECT count(*) FROM pg_constraint WHERE contype='c' AND connamespace='public'::regnamespace AND conname LIKE 'ck\_%')
                    || ' partial_indexes=' || (SELECT count(*) FROM pg_index WHERE indpred IS NOT NULL AND indrelid::regclass::text IN ('question_versions','question_sources','topics','tags','colleges','question_assets'));" || true
            echo "--- protected constraints visible to SQL directly:"
            psql -h localhost -p "$port" -U g3 -d "$db" -Atc \
              "SELECT conname, pg_get_constraintdef(oid) FROM pg_constraint
                WHERE conname = ANY (ARRAY['fk_questions_level_subject','fk_questions_chapter_subject',
                  'fk_questions_topic_chapter','fk_questions_subtopic_topic',
                  'fk_answer_keys_options_of_version']) ORDER BY 1;" || true
            psql -h localhost -p "$port" -U g3 -d "$db" -Atc \
              "SELECT coalesce(json_agg(row_to_json(t)), '[]'::json) FROM ($Q) t;" > "$f" || true
            echo "--- catalog rows captured: $(wc -c < "$f") bytes"
            if python3 docs/database/g1-spike/option-c/guard.py catalog "$f"; then
              echo "$db: OK"
            else
              echo "::error::$db failed the protected-constraint catalog assertion"
              rc=1
            fi
            # The whole inventory is asserted here too, not just the five.
            inv="$(psql -h localhost -p "$port" -U g3 -d "$db" -Atc \
              "SELECT (SELECT count(*) FROM pg_tables WHERE schemaname='public' AND tablename <> '_prisma_migrations') || '/' ||
                      (SELECT count(*) FROM pg_type WHERE typtype='e' AND typnamespace='public'::regnamespace) || '/' ||
                      (SELECT count(*) FROM pg_constraint WHERE contype='f' AND connamespace='public'::regnamespace) || '/' ||
                      (SELECT count(*) FROM pg_constraint WHERE contype='c' AND connamespace='public'::regnamespace AND conname LIKE 'ck\_%');")"
            echo "--- inventory tables/enums/fks/checks = $inv (expected 18/7/26/47)"
            if [ "$inv" != "18/7/26/47" ]; then
              echo "::error::$db inventory is $inv, expected 18/7/26/47"
              rc=1
            fi
          done
          exit $rc

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase04a-g3-full-${{ matrix.node }}
          path: docs/database/g1-spike/option-c/g3-full/out/
          if-no-files-found: warn
          retention-days: 30

      - name: Job summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Phase 04A — G-3 full-schema gate"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Node | ${{ matrix.node }} |"
            echo "| Prisma (pinned) | $PRISMA_VERSION |"
            echo "| PostgreSQL | 16 |"
            echo "| Schema | \`prisma/schema.prisma\` (18 tables, real) |"
            echo "| Migration | \`prisma/migrations/0001_phase04a_question_bank\` |"
            echo "| Result | ${{ job.status }} |"
            echo
            echo "G-1 remains **FAILED** and is not re-scored by this workflow."
            echo
            if [ -f docs/database/g1-spike/option-c/g3-full/out/RESULT.txt ]; then
              echo '```'
              cat docs/database/g1-spike/option-c/g3-full/out/RESULT.txt
              echo '```'
            else
              echo "The gate did not reach its verdict. Read the failing step; every"
              echo "step names the criterion it tests and what its result establishes."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
